<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin MI KBC - KMA 1503</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar agar textarea lebih cantik */
        textarea::-webkit-scrollbar { width: 5px; }
        textarea::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        body { padding-bottom: 140px; } /* Jarak agar tidak tertutup iklan footer */
    </style>
</head>
<body class="bg-slate-50">

    <!-- Iklan Atas Tengah -->
    <div class="w-full flex flex-col items-center justify-center bg-white py-2 border-b shadow-sm">
        <span class="text-[8px] text-gray-400 mb-1 tracking-widest uppercase">Advertisement</span>
        <div class="flex justify-center w-full overflow-hidden scale-75 md:scale-100">
            <script type="text/javascript">
                atOptions = {
                    'key' : '439d20ec19cea92a002688770239b3f7',
                    'format' : 'iframe',
                    'height' : 90,
                    'width' : 728,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/439d20ec19cea92a002688770239b3f7/invoke.js"></script>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-4 md:p-6 bg-white shadow-xl rounded-b-2xl mb-10">
        <header class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-extrabold text-green-700 leading-tight">Administrasi Madrasah Ibtidaiyah</h1>
            <p class="text-xs md:text-sm text-gray-500 italic">Generator Otomatis Kurikulum Berbasis Cinta (KMA 1503/2025)</p>
        </header>

        <!-- Shortcut Bar -->
        <div class="flex justify-center mb-6">
            <a href="URL_APP_KOKURIKULER" class="px-4 py-2 bg-pink-50 text-pink-600 border border-pink-100 rounded-full text-[10px] md:text-xs font-bold hover:bg-pink-100 transition flex items-center gap-2">
                🚀 Shortcut: App Kokurikuler (P5-PPRA)
            </a>
        </div>

        <!-- FORM INPUT -->
        <div class="space-y-3">
            <!-- Baris 1: Madrasah & Tahun -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-2">
                    <label class="text-[10px] font-bold text-green-700 uppercase ml-1">Nama Madrasah</label>
                    <input type="text" id="madrasah" placeholder="Nama MI..." class="w-full p-2 border rounded-lg text-sm focus:ring-1 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-green-700 uppercase ml-1">Tahun Ajaran</label>
                    <input type="text" id="tahun_ajaran" placeholder="2025/2026" class="w-full p-2 border rounded-lg text-sm focus:ring-1 focus:ring-green-500 outline-none">
                </div>
            </div>

            <!-- Baris 2: Mapel & Fase -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-1">
                    <label class="text-[10px] font-bold text-green-700 uppercase ml-1">Mata Pelajaran</label>
                    <input type="text" id="mapel" placeholder="Al-Qur'an Hadis" class="w-full p-2 border rounded-lg text-sm focus:ring-1 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-green-700 uppercase ml-1">Fase / Kelas</label>
                    <input type="text" id="fase_kelas" placeholder="Fase A / Kelas 1" class="w-full p-2 border rounded-lg text-sm focus:ring-1 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-green-700 uppercase ml-1">Durasi</label>
                    <select id="pilihan_durasi" class="w-full p-2 border rounded-lg text-sm focus:ring-1 focus:ring-green-500 outline-none bg-white">
                        <option value="1">Semester Ganjil</option>
                        <option value="2">Semester Genap</option>
                        <option value="Tahun">Full 1 Tahun Ajaran</option>
                    </select>
                </div>
            </div>

            <!-- Baris 3: Data Kamad & Titimangsa -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-blue-700 uppercase block border-b pb-1">Kepala Madrasah</label>
                    <input type="text" id="nama_kamad" placeholder="Nama Kepala" class="w-full p-2 border rounded-md text-sm">
                    <input type="text" id="nip_kamad" placeholder="NIP Kamad" class="w-full p-2 border rounded-md text-sm">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-blue-700 uppercase block border-b pb-1">Titimangsa</label>
                    <input type="text" id="tempat_tanggal" placeholder="Kota, Tanggal..." class="w-full p-2 border rounded-md text-sm">
                    <p class="text-[9px] text-gray-400 italic">*Contoh: Jakarta, 10 Juli 2025</p>
                </div>
            </div>

            <!-- Baris 4: Data Guru -->
            <div class="bg-green-50 p-3 rounded-xl border border-green-100 grid grid-cols-1 md:grid-cols-2 gap-3">
                <div class="md:col-span-2">
                    <label class="text-[10px] font-bold text-green-700 uppercase block border-b border-green-200 pb-1 mb-2">Identitas Guru Pengampu</label>
                </div>
                <input type="text" id="nama_guru" placeholder="Nama Guru" class="w-full p-2 border rounded-md text-sm">
                <input type="text" id="nip_guru" placeholder="NIP Guru" class="w-full p-2 border rounded-md text-sm">
            </div>

            <!-- Baris 5: Teks CP -->
            <div>
                <label class="text-[10px] font-bold text-red-700 uppercase ml-1">Capaian Pembelajaran (CP)</label>
                <textarea id="cp" rows="4" class="w-full mt-1 p-3 border rounded-lg text-sm focus:ring-1 focus:ring-red-500 outline-none" placeholder="Tempel CP dari PDF KMA di sini..."></textarea>
            </div>

            <!-- Tombol Action -->
            <button onclick="prosesAdmin()" id="btnProses" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                <span>GENERATE 5 DOKUMEN SEKARANG</span>
            </button>
        </div>

        <!-- AREA HASIL -->
        <div id="hasil" class="hidden mt-8 p-4 bg-white border-2 border-dashed border-green-200 rounded-2xl">
            <h2 class="text-sm font-bold text-green-800 mb-3 flex items-center gap-2">
                ✅ Dokumen Berhasil Dibuat:
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2" id="linkContainer">
                <!-- Link akan muncul di sini secara otomatis -->
            </div>
        </div>
    </div>

    <!-- Iklan Footer -->
    <div class="fixed bottom-0 w-full bg-white/90 backdrop-blur-sm border-t text-center shadow-2xl z-50 py-2">
        <span class="text-[8px] text-gray-400 block pb-1">Advertisement</span>
        <div id="at-footer" style="transform: scale(0.85); transform-origin: bottom center;">
            <script src="https://pl28756503.effectivegatecpm.com/ae/78/47/ae78476ec215b28ed05d857649e2c558.js"></script>
        </div>
    </div>

    <script>
        async function prosesAdmin() {
            const btn = document.getElementById('btnProses');
            const linkContainer = document.getElementById('linkContainer');
            const hasilDiv = document.getElementById('hasil');

            // Validasi sederhana
            if(!document.getElementById('cp').value) {
                alert("Harap tempelkan teks CP terlebih dahulu.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span>Menyusun 5 Dokumen (± 1 Menit)...</span>
            `;

            const payload = {
                madrasah: document.getElementById('madrasah').value,
                tahun_ajaran: document.getElementById('tahun_ajaran').value,
                mapel: document.getElementById('mapel').value,
                fase_kelas: document.getElementById('fase_kelas').value,
                nama_kamad: document.getElementById('nama_kamad').value,
                nip_kamad: document.getElementById('nip_kamad').value,
                nama_guru: document.getElementById('nama_guru').value,
                nip_guru: document.getElementById('nip_guru').value,
                tempat_tanggal: document.getElementById('tempat_tanggal').value,
                pilihan_durasi: document.getElementById('pilihan_durasi').value,
                cp: document.getElementById('cp').value
            };

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbxPMrTs0xokf9hT31DBxJiq_Fi6rq8MLqYPGN2y2dV9fk-C8e9jmT4XEfkCTcj1jEI/exec', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const urls = await response.json();
                
                // Fungsi untuk menampilkan hasil secara dinamis
                linkContainer.innerHTML = "";
                const labels = {
                    lk1: "📄 LK-1 Analisis CP-TP",
                    tpatp: "📄 TP & ATP (1 Tahun)",
                    prota: "📄 Program Tahunan",
                    prosem: "📄 Program Semester",
                    modul: "📄 Modul Ajar (Deep Learning)"
                };

                for (const key in urls) {
                    if (urls[key] && !urls[key].includes("error")) {
                        linkContainer.innerHTML += `
                            <a href="${urls[key]}" target="_blank" class="flex items-center justify-between p-3 bg-green-50 text-green-700 rounded-lg border border-green-100 hover:bg-green-100 transition text-xs font-bold">
                                ${labels[key] || key.toUpperCase()}
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </a>
                        `;
                    }
                }
                
                hasilDiv.classList.remove('hidden');
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            } catch (e) {
                console.error(e);
                alert("Gagal terhubung ke server Google Apps Script. Pastikan skrip sudah di-deploy sebagai 'Anyone'.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "GENERATE 5 DOKUMEN SEKARANG";
            }
        }
    </script>
</body>
</html>
