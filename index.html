<body class="bg-slate-50">

    <!-- Iklan Atas -->

            </script>
            <script src="https://www.highperformanceformat.com/439d20ec19cea92a002688770239b3f7/invoke.js"></script>

    <div class="max-w-4xl mx-auto p-4 md:p-6 bg-white shadow-2xl rounded-b-3xl">

            <h1 class="text-2xl md:text-3xl font-black text-green-700 tracking-tighter uppercase">Administrasi MI AI</h1>

        <!-- 3 Tombol Shortcut Eksternal -->

            <!-- Ganti href="#" dengan Link Google Drive PDF CP Anda -->

            <a href="https://appkokurikuler.vercel.app" class="px-5 py-2 bg-pink-50 text-pink-600 border border-pink-200 rounded-full text-[10px] font-bold shadow-sm hover:bg-pink-100 transition flex items-center gap-2">

        <div class="space-y-3">

                    <label class="input-label">Nama Madrasah</label>

                <div>
                    <label class="input-label">Pilihan Durasi</label>
                    <select id="pilihan_durasi" class="w-full p-2 border rounded-lg text-sm bg-white">
                        <option value="1">Semester Ganjil Saja</option>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-slate-50 p-4 rounded-2xl border">
                <div class="space-y-2">

                    <input type="text" id="nama_kamad" placeholder="Nama Kamad" class="w-full p-2 border rounded text-sm mb-1">
                    <input type="text" id="nip_kamad" placeholder="NIP Kamad" class="w-full p-2 border rounded text-sm">
                </div>
                <div class="space-y-2">
                    <label class="input-label !text-blue-700">Guru & Titimangsa</label>
                    <input type="text" id="nama_guru" placeholder="Nama Guru" class="w-full p-2 border rounded text-sm mb-1">
                    <input type="text" id="nip_guru" placeholder="NIP Guru" class="w-full p-2 border rounded text-sm mb-1">

            <div>
                <label class="input-label !text-red-600">Tempel CP (Capaian Pembelajaran)</label>
                <textarea id="cp" rows="5" class="w-full p-3 border rounded-xl text-xs outline-red-400" placeholder="Salin CP dari PDF KMA di sini..."></textarea>
            </div>

            <button onclick="prosesAdmin()" id="btnProses" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-95">
                GENERATE 4 DOKUMEN SEKARANG
            </button>

        <div id="hasil" class="hidden mt-8 p-5 bg-green-50 border-2 border-dashed border-green-200 rounded-3xl animate-pulse">
            <h2 class="text-xs font-black text-green-800 mb-3 uppercase">✅ Dokumen Siap di Drive Anda:</h2>

    <!-- Iklan Footer -->
    <div class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t text-center shadow-2xl py-2 z-50">
        <span class="text-[8px] text-gray-400 block mb-1">ADVERTISEMENT</span>
        <div class="scale-90 origin-bottom">
            <script src="https://pl28756503.effectivegatecpm.com/ae/78/47/ae78476ec215b28ed05d857649e2c558.js"></script>
        </div>

    <script>
        let currentFiles = {}; 

async function prosesAdmin() {
    const btn = document.getElementById('btnProses');
    const linkContainer = document.getElementById('linkContainer');
    const hasilDiv = document.getElementById('hasil');
    
    if(!document.getElementById('cp').value) {
        alert("Mohon tempelkan Teks Capaian Pembelajaran (CP) terlebih dahulu!");
        document.getElementById('cp').focus();
        return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span class="animate-pulse">⏳ SEDANG MEMPROSES AI & MENYUSUN 4 DOKUMEN...</span>`;
    hasilDiv.classList.add('hidden');

    const payload = {
        madrasah: document.getElementById('madrasah').value,
        tahun_ajaran: document.getElementById('tahun_ajaran').value,
        mapel: document.getElementById('mapel').value,
        fase_kelas: document.getElementById('fase_kelas').value,
        nama_kamad: document.getElementById('nama_kamad').value,
        nip_kamad: document.getElementById('nip_kamad').value,
        nama_guru: document.getElementById('nama_guru').value,
        nip_guru: document.getElementById('nip_guru').value,
        tempat_tanggal: document.getElementById('tempat_tanggal').value,
        pilihan_durasi: document.getElementById('pilihan_durasi').value,
        cp: document.getElementById('cp').value
    };

    try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbwxiHYTHfGWH7EjLIW-YWbLAUGop7r6P1HQe6-EcvazlDzSbuihJHlsHPFP28KliY94/exec', {
            method: 'POST',
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
            redirect: "follow"
        });
        
        const urls = await response.json();
        
        if (urls.error) {
            throw new Error(urls.error);
        }

        currentFiles = urls; 
        linkContainer.innerHTML = "";
        
        linkContainer.innerHTML += `
            <button onclick="downloadSemua()" class="col-span-full mb-4 p-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
                📥 DOWNLOAD SEMUA SEKALIGUS (.DOCX)
            </button>
        `;

        const labels = { lk1: "LK-1 Analisis CP", tpatp: "TP & ATP", prota: "Program Tahunan", prosem: "Program Semester" };
        for (const key in urls) {
            if(urls[key]) {
                linkContainer.innerHTML += `
                    <a href="${urls[key]}" target="_blank" class="p-3 bg-white text-green-700 rounded-lg border border-green-200 text-[10px] font-bold shadow-sm hover:shadow-md hover:bg-green-50 flex justify-between items-center transition uppercase">
                        ${labels[key] || key} <span class="text-sm">🔗</span>
                    </a>
                `;
            }
        }
        
        hasilDiv.classList.remove('hidden');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

    } catch (e) {
        alert("Gagal memproses dokumen!\n\nPesan Error: " + e.message);
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.innerHTML = "GENERATE 4 DOKUMEN SEKARANG";
    }
}

// === FIX: LOGIKA DOWNLOAD SEMUA YANG LEBIH KUAT ===
function downloadSemua() {
    // 1. Peringatan Dini kepada User
    alert("⚠️ PENTING:\n\nBrowser Anda mungkin akan memblokir download file ke-2, ke-3, dst.\n\nJika hanya 1 file yang terdownload, LIHAT POJOK KANAN ATAS browser (Address Bar), cari ikon 'Pop-up blocked' (kotak disilang merah), lalu pilih 'Always allow...' dan coba download lagi.");

    const keys = Object.keys(currentFiles);
    if (keys.length === 0) return;

    let i = 0;
    
    // Gunakan setInterval agar lebih stabil daripada loop for
    const intervalId = setInterval(() => {
        if (i >= keys.length) {
            clearInterval(intervalId);
            return;
        }

        const key = keys[i];
        const originalUrl = currentFiles[key];

        if (originalUrl) {
            // Ubah link edit menjadi link export docx
            const downloadUrl = originalUrl.replace('/edit?usp=drivesdk', '/export?format=docx')
                                         .replace('/edit', '/export?format=docx');
            
            // Buat elemen link tersembunyi
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.target = "_blank"; // Membuka di tab baru kadang membantu bypass blocker
            link.setAttribute('download', `${key}_${Date.now()}.docx`);
            document.body.appendChild(link);
            
            // Klik otomatis
            link.click();
            
            // Bersihkan
            document.body.removeChild(link);
        }

        i++;
    }, 1500); // Jeda 1.5 Detik per file (Waktu aman agar tidak dianggap spam)
}
    </script>
