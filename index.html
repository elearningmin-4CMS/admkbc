<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin MI KBC Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding-bottom: 150px; }
        .input-label { font-size: 10px; font-weight: bold; color: #15803d; text-transform: uppercase; margin-bottom: 2px; display: block; }
    </style>
</head>
<body class="bg-slate-50">

    <!-- Iklan Atas -->
    <div class="w-full flex flex-col items-center bg-white py-2 border-b">
        <span class="text-[8px] text-gray-400 mb-1">ADVERTISEMENT</span>
        <div class="scale-75 md:scale-100">
            <script type="text/javascript">
                atOptions = { 'key' : '439d20ec19cea92a002688770239b3f7', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
            </script>
            <script src="https://www.highperformanceformat.com/439d20ec19cea92a002688770239b3f7/invoke.js"></script>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-4 md:p-6 bg-white shadow-2xl rounded-b-3xl">
        <header class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-black text-green-700 tracking-tighter uppercase">Administrasi MI AI</h1>
            <p class="text-[10px] text-gray-500 italic">Otomatisasi KMA 1503/2025 - Kurikulum Berbasis Cinta</p>
        </header>

        <!-- Shortcut -->
        <div class="flex justify-center mb-6">
            <a href="https://appkokurikuler.vercel.app" class="px-5 py-2 bg-pink-50 text-pink-600 border border-pink-200 rounded-full text-[10px] font-bold shadow-sm hover:bg-pink-100 transition flex items-center gap-2">
                🚀 App Kokurikuler (P5-PPRA)
            </a>
        </div>

        <div class="space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                <div class="md:col-span-2">
                    <label class="input-label">Nama Madrasah</label>
                    <input type="text" id="madrasah" class="w-full p-2 border rounded-lg text-sm outline-green-500">
                </div>
                <div>
                    <label class="input-label">Tahun Ajaran</label>
                    <input type="text" id="tahun_ajaran" placeholder="2025/2026" class="w-full p-2 border rounded-lg text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                <div>
                    <label class="input-label">Mata Pelajaran</label>
                    <input type="text" id="mapel" class="w-full p-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="input-label">Fase / Kelas</label>
                    <input type="text" id="fase_kelas" class="w-full p-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="input-label">Pilihan Durasi</label>
                    <select id="pilihan_durasi" class="w-full p-2 border rounded-lg text-sm bg-white">
                        <option value="1">Semester Ganjil Saja</option>
                        <option value="2">Semester Genap Saja</option>
                        <option value="Tahun">Full 1 Tahun Ajaran</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-slate-50 p-4 rounded-2xl border">
                <div class="space-y-2">
                    <label class="input-label !text-blue-700">Kepala Madrasah (Nama & NIP)</label>
                    <input type="text" id="nama_kamad" placeholder="Nama Kamad" class="w-full p-2 border rounded text-sm mb-1">
                    <input type="text" id="nip_kamad" placeholder="NIP Kamad" class="w-full p-2 border rounded text-sm">
                </div>
                <div class="space-y-2">
                    <label class="input-label !text-blue-700">Guru & Titimangsa</label>
                    <input type="text" id="nama_guru" placeholder="Nama Guru" class="w-full p-2 border rounded text-sm mb-1">
                    <input type="text" id="nip_guru" placeholder="NIP Guru" class="w-full p-2 border rounded text-sm mb-1">
                    <input type="text" id="tempat_tanggal" placeholder="Kota, Tanggal" class="w-full p-2 border rounded text-sm">
                </div>
            </div>

            <div>
                <label class="input-label !text-red-600">Tempel CP (Capaian Pembelajaran)</label>
                <textarea id="cp" rows="5" class="w-full p-3 border rounded-xl text-xs outline-red-400" placeholder="Salin CP dari PDF KMA di sini..."></textarea>
            </div>

            <button onclick="prosesAdmin()" id="btnProses" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-2xl shadow-lg transition active:scale-95">
                GENERATE 5 DOKUMEN SEKARANG
            </button>
        </div>

        <div id="hasil" class="hidden mt-8 p-5 bg-green-50 border-2 border-dashed border-green-200 rounded-3xl animate-pulse">
            <h2 class="text-xs font-black text-green-800 mb-3 uppercase">✅ Dokumen Siap di Drive Anda:</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2" id="linkContainer"></div>
        </div>
    </div>

    <!-- Iklan Footer -->
    <div class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t text-center shadow-2xl py-2 z-50">
        <span class="text-[8px] text-gray-400 block mb-1">ADVERTISEMENT</span>
        <div class="scale-90 origin-bottom">
            <script src="https://pl28756503.effectivegatecpm.com/ae/78/47/ae78476ec215b28ed05d857649e2c558.js"></script>
        </div>
    </div>

    <script>
        async function prosesAdmin() {
            const btn = document.getElementById('btnProses');
            const linkContainer = document.getElementById('linkContainer');
            if(!document.getElementById('cp').value) return alert("Isi CP dulu!");

            btn.disabled = true;
            btn.innerHTML = "⏳ PROSES ANALISIS AI (±60 DETIK)...";

            const payload = {
                madrasah: document.getElementById('madrasah').value,
                tahun_ajaran: document.getElementById('tahun_ajaran').value,
                mapel: document.getElementById('mapel').value,
                fase_kelas: document.getElementById('fase_kelas').value,
                nama_kamad: document.getElementById('nama_kamad').value,
                nip_kamad: document.getElementById('nip_kamad').value,
                nama_guru: document.getElementById('nama_guru').value,
                nip_guru: document.getElementById('nip_guru').value,
                tempat_tanggal: document.getElementById('tempat_tanggal').value,
                pilihan_durasi: document.getElementById('pilihan_durasi').value,
                cp: document.getElementById('cp').value
            };

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbxPMrTs0xokf9hT31DBxJiq_Fi6rq8MLqYPGN2y2dV9fk-C8e9jmT4XEfkCTcj1jEI/exec', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const urls = await response.json();
                
                linkContainer.innerHTML = "";
                const labels = { lk1: "LK-1 Analisis", tpatp: "TP & ATP", prota: "Prota", prosem: "Prosem", modul: "Modul Ajar KBC" };
                for(let key in urls) {
                    if(!urls[key].includes("error")) {
                        linkContainer.innerHTML += `<a href="${urls[key]}" target="_blank" class="p-3 bg-white text-green-700 rounded-xl border border-green-200 text-[10px] font-bold shadow-sm hover:shadow-md transition">📄 ${labels[key]} 🔗</a>`;
                    }
                }
                document.getElementById('hasil').classList.remove('hidden');
                btn.innerHTML = "GENERATE 5 DOKUMEN SEKARANG";
                btn.disabled = false;
            } catch (e) {
                alert("Error! Pastikan Deploy Script sudah 'New Version' & 'Anyone'.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
