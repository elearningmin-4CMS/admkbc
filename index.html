<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin MI KBC - KMA 1503</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 pb-20">
<!-- Container Iklan Atas Tengah -->
<div class="w-full flex flex-col items-center justify-center bg-white py-4 border-b shadow-sm">
    <!-- Label kecil agar terlihat profesional dan mematuhi aturan iklan -->
    <span class="text-[10px] text-gray-400 mb-2 tracking-widest uppercase">Advertisement</span>
    
    <div class="flex justify-center w-full overflow-hidden">
        <!-- Script Adsterra Anda Mulai Sini -->
        <script type="text/javascript">
            atOptions = {
                'key' : '439d20ec19cea92a002688770239b3f7',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/439d20ec19cea92a002688770239b3f7/invoke.js"></script>
        <!-- Script Adsterra Anda Selesai Sini -->
    </div>
</div>

    <div class="max-w-4xl mx-auto p-6 bg-white shadow-xl rounded-b-2xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-green-700">Administrasi Madrasah Ibtidaiyah</h1>
            <p class="text-gray-500 italic">Generator Otomatis Kurikulum Berbasis Cinta (KMA 1503/2025)</p>
        </header>

        <!-- Shortcut Bar -->
        <div class="flex gap-4 mb-8 justify-center">
            <a href="URL_APP_KOKURIKULER" class="px-4 py-2 bg-pink-50 text-pink-600 border border-pink-200 rounded-full text-xs font-bold hover:bg-pink-100">
                🚀 Shortcut: App Kokurikuler (P5-PPRA)
            </a>
        </div>

        <div class="p-6 md:p-8 space-y-4">
    <!-- BARIS 1: Informasi Dasar -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div class="col-span-1 md:col-span-2">
            <label class="block text-[11px] font-bold text-green-700 uppercase ml-1">Nama Madrasah</label>
            <input type="text" id="madrasah" placeholder="Contoh: MI Al-Ikhlas" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm">
        </div>
        <div>
            <label class="block text-[11px] font-bold text-green-700 uppercase ml-1">Tahun Ajaran</label>
            <input type="text" id="tahun_ajaran" placeholder="2025/2026" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm">
        </div>
    </div>

    <!-- BARIS 2: Mapel & Fase -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
            <label class="block text-[11px] font-bold text-green-700 uppercase ml-1">Mata Pelajaran</label>
            <input type="text" id="mapel" placeholder="Al-Qur'an Hadis" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm">
        </div>
        <div>
            <label class="block text-[11px] font-bold text-green-700 uppercase ml-1">Fase / Kelas (Manual)</label>
            <input type="text" id="fase_kelas" placeholder="Fase A / Kelas 1" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm">
        </div>
    </div>

    <!-- BARIS 3: Penandatangan (Kamad & Titimangsa) -->
    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-2">
            <label class="block text-[11px] font-bold text-blue-700 uppercase border-b pb-1">Kepala Madrasah</label>
            <input type="text" id="nama_kamad" placeholder="Nama Kepala Madrasah" class="w-full p-2 border rounded-md text-sm">
            <input type="text" id="nip_kamad" placeholder="NIP. 1980..." class="w-full p-2 border rounded-md text-sm">
        </div>
        <div class="space-y-2">
            <label class="block text-[11px] font-bold text-blue-700 uppercase border-b pb-1">Titimangsa (Tempat, Tanggal)</label>
            <input type="text" id="tempat_tanggal" placeholder="Jakarta, 14 Juli 2025" class="w-full p-2 border rounded-md text-sm">
            <p class="text-[10px] text-gray-400 italic">*Muncul di pojok kanan atas tanda tangan</p>
        </div>
    </div>

    <!-- BARIS 4: Penandatangan (Guru) -->
    <div class="bg-green-50 p-4 rounded-xl border border-green-200 space-y-2">
        <label class="block text-[11px] font-bold text-green-700 uppercase border-b border-green-200 pb-1">Identitas Guru Pengampu</label>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input type="text" id="nama_guru" placeholder="Nama Lengkap Guru" class="w-full p-2 border rounded-md text-sm">
            <input type="text" id="nip_guru" placeholder="NIP. 1995..." class="w-full p-2 border rounded-md text-sm">
        </div>
    </div>

    <!-- BARIS 5: Input CP -->
    <div>
        <label class="block text-[11px] font-bold text-red-700 uppercase ml-1">Capaian Pembelajaran (CP)</label>
        <textarea id="cp" rows="5" class="w-full mt-1 p-3 border rounded-lg outline-none focus:ring-2 focus:ring-red-500 text-sm" placeholder="Tempel teks CP di sini..."></textarea>
    </div>

    <button onclick="prosesAdmin()" id="btnProses" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transform transition active:scale-95">
        GENERATE 5 DOKUMEN SEKARANG
    </button>
</div>
        <!-- Hasil -->
        <div id="hasil" class="hidden mt-10 space-y-4">
            <h2 class="font-bold border-b pb-2">Dokumen Berhasil Dibuat:</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="linkContainer"></div>
        </div>
    </div>

   <!-- Iklan Footer (Social Bar / Native) -->
<div class="fixed bottom-0 w-full bg-white/90 backdrop-blur-sm border-t text-center shadow-2xl z-50" style="height: auto; max-height: 100px; overflow: visible;">
    <!-- Label kecil agar tetap elegan -->
    <span class="text-[8px] text-gray-400 block pt-1">Advertisement</span>

    <div id="at-footer" style="transform: scale(0.7); transform-origin: bottom center; margin-top: -10px;">
        <!-- KECILKAN DENGAN SCALE: 0.7 berarti ukuran jadi 70% -->
        <script src="https://pl28756503.effectivegatecpm.com/ae/78/47/ae78476ec215b28ed05d857649e2c558.js"></script>
    </div>
</div>

<!-- Tambahkan Padding di bawah body agar tombol "Generate" tidak tertutup footer -->
<style>
    body { padding-bottom: 120px; }
</style>

    <script>
async function prosesAdmin() {
    const btn = document.getElementById('btnProses');
    btn.disabled = true;
    btn.innerHTML = "⏳ Sedang memproses 5 dokumen...";

    const payload = {
        madrasah: document.getElementById('madrasah').value,
        tahun_ajaran: document.getElementById('tahun_ajaran').value,
        mapel: document.getElementById('mapel').value,
        fase_kelas: document.getElementById('fase_kelas').value,
        nama_kamad: document.getElementById('nama_kamad').value,
        nip_kamad: document.getElementById('nip_kamad').value,
        nama_guru: document.getElementById('nama_guru').value,
        nip_guru: document.getElementById('nip_guru').value,
        tempat_tanggal: document.getElementById('tempat_tanggal').value,
        cp: document.getElementById('cp').value
    };

    try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbxPMrTs0xokf9hT31DBxJiq_Fi6rq8MLqYPGN2y2dV9fk-C8e9jmT4XEfkCTcj1jEI/exec', {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        const urls = await response.json();
        
        // Logika menampilkan link hasil (sama seperti sebelumnya)
        tampilkanHasil(urls);
    } catch (e) {
        alert("Gagal terhubung ke server. Pastikan URL Apps Script benar.");
    } finally {
        btn.disabled = false;
        btn.innerHTML = "GENERATE 5 DOKUMEN SEKARANG";
    }
}
    </script>
</body>
</html>
